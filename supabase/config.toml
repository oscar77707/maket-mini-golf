# Configuration Supabase CLI (développement local). Voir README.md.
project_id = "palmeraie"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_confirmations = false

# Invitation envoyée par le gérant : le lien passe par /auth/callback avec un jeton à usage unique
# (le serveur ne peut pas faire le flux PKCE que Supabase utilise par défaut). Voir README, étape 6.
[auth.email.template.invite]
subject = "Votre accès à La Palmeraie"
content_path = "./templates/invite.html"
